name: test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm
      - name: Check VERSION matches manifest version
        run: test "$(cat VERSION)" = "$(jq -r .version src/manifest.json)"
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run build
