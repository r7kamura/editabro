name: bump

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.2.3), or patch, minor, or major.
        required: true
        default: patch
        type: string

permissions: {}

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          current_version="$(jq -r .version src/manifest.json)"
          IFS=. read -r major minor patch <<< "$current_version"
          case "$INPUT_VERSION" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
            *) version="$INPUT_VERSION" ;;
          esac
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version"
            exit 1
          fi
          if [ "$version" = "$current_version" ]; then
            echo "Version $version is already set."
            exit 1
          fi
          echo "Current version: $current_version"
          echo "New version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          branch="version-$VERSION"
          sed -i -E "s/(\"version\": \")[^\"]+/\\1$VERSION/" src/manifest.json
          git switch -c "$branch"
          git add src/manifest.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Release $VERSION"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Release $VERSION" \
            --body "Bump the manifest version to $VERSION. The existing release workflow creates the tag, the GitHub Release, and the dist.zip asset with GITHUB_TOKEN."
          gh pr merge "$branch" --merge --delete-branch
          gh workflow run release.yml --ref main
